user root;
worker_processes 1;             # Number of worker processes
worker_cpu_affinity auto;       # Pin workers to CPU cores (options: auto|mask)
error_log logs/error.log error; # Log level error (options: debug|info|notice|warn|error|crit|alert|emerg)

load_module modules/ngx_ssl_engine_qat_module.so;     # Enabled for QAT Crypto Acceleration
load_module modules/ngx_http_qatzip_filter_module.so; # Enabled for QAT Compression Acceleration

ssl_engine {
    use_engine qatengine;                  # Using QAT Engine for Acceleration
    default_algorithms RSA,EC,DH,DSA,PKEY; # Algorithms to Accelerate through QAT Engine (options: RSA, EC, DH, DSA, PKEY, CIPHERS, ALL)

    qat_engine {
        qat_offload_mode async;            # Offload mode (options: sync|async)
        qat_notify_mode poll;              # Notify mode (options: event|poll)
        qat_poll_mode heuristic;           # Heuristic/External for performance  (options: heuristic|external|internal)
        qat_sw_fallback off;               # Software fallback on QAT HW failures (options: on|off)
        qat_shutting_down_release off;     # Release QAT instances on shutdown (options: on|off)
    }
}

events {
    use epoll;                 # epoll is efficient for Linux (options: epoll|kqueue|select|poll|/dev/poll|eventport)
    worker_connections 102400; # Max connections per worker
}

http {
    include mime.types;                    # MIME types mapping
    default_type application/octet-stream; # Default MIME type

    # Gzip SW compression
    gzip on;
    gzip_min_length 128;
    gzip_comp_level 1;
    gzip_vary on;
    gzip_disable  "msie6";
    gzip_types text/css text/javascript text/xml text/plain text/x-component font/truetype font/opentype image/jpeg image/svg+xml
               application/javascript application/json application/xml application/rss+xml application/vnd.ms-fontobject application/octet-stream;

    # QAT compression (Remove for QAT Crypto only acceleration)
    qatzip_sw failover;                    # Software fallback on failure (options: only|failover|no)
    qatzip_min_length 128;                 # Min file size to compress (range: 0-2000)
    qatzip_comp_level 1;                   # Compression level (range: 1-9, higher=slower)
    qatzip_buffers 16 8k;                  # QAT Compression buffer pool
    qatzip_chunk_size 64k;                 # Compression chunk size
    qatzip_stream_size 256k;               # Stream window size
    qatzip_sw_threshold 256;               # Min size to offload to HW
    qatzip_types text/css text/javascript text/xml text/plain text/x-component font/truetype font/opentype image/jpeg image/svg+xml
                 application/javascript application/json application/xml application/rss+xml application/vnd.ms-fontobject application/octet-stream;

    # HTTP server listening at Port 80
    server {
        listen 80 reuseport;               # resueport - workers share the port to reduce accept contention (not ideal if workers differ in speed)
        server_name localhost;

        location / {
            root html;
            index index.html index.htm;
        }
    }

    # HTTPS server with async mode listening at Port 443
    server {
        listen 443 ssl reuseport;          # reuseport - Same port sharing for TLS to improve load spreading (avoid if mixing fast/slow workers)
        server_name localhost;

        ssl_asynch on;                     # Async QAT processing for performance (options: on|off)
        ssl_protocols TLSv1.3;             # TLS protocol versions (options: TLSv1.2|TLSv1.3)
        ssl_ecdh_curve X25519;             # Elliptic curve Key Exchange (options: X25519|X448|prime256v1|secp384r1|secp521r1)
        ssl_certificate cert.pem;          # Certificate file
        ssl_certificate_key cert.key;      # Private key file
        ssl_session_cache off;             # Session cache (options: off|none|builtin|shared:NAME:SIZE)
        ssl_session_timeout 5m;            # Session reuse timeout
        ssl_ciphers  HIGH:!aNULL:!MD5;     # Only High secure ciphers
        ssl_prefer_server_ciphers on;      # Server cipher preference (options: on|off)

        location / {
            root   html;
            index  index.html index.htm;
        }
    }
}
