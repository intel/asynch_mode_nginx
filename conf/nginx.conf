user  root;
worker_processes 1;
worker_cpu_affinity auto;
#worker_cpu_affinity auto 11111111111111110;
#worker_cpu_affinity 0000000000101101;
#error_log  logs/error.log;
error_log  logs/error.log  error;
#error_log  logs/error.log  debug;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;
load_module modules/ngx_ssl_engine_qat_module.so;
ssl_engine {
    use_engine qatengine;
    default_algorithms RSA,EC,DH,DSA,PKEY;
    default_algorithms ALL;
    #default_algorithms RSA,EC,PKEY;
    qat_engine {
       #qat_sw_fallback on;
       qat_offload_mode async;
       qat_notify_mode poll;
       #qat_poll_mode heuristic;
       qat_poll_mode internal;
       #qat_shutting_down_release off;
    }
}

#worker_rlimit_nofile 1000000;
master_process on;
events {
    use epoll;
    worker_connections  102400;
    #multi_accept on;
    accept_mutex on;
}

http {
    include       mime.types;
    #keepalive_timeout 0;
    access_log off;
    server
    {
        ssl_asynch on;
        #listen       1440 backlog=10232;
        #listen       1440 ssl reuseport backlog=1023;
        listen       1440 ssl reuseport backlog=1023 so_keepalive=off;
        keepalive_timeout 100000s;
        keepalive_requests 100000;
        server_name  localhost;
        #ssl_certificate      ssl.certs/server-rsa-pss2k.cert.pem;
        #ssl_certificate_key  ssl.certs/server-rsa-pss2k.key.pem;
        #ssl_dhparam          ssl.certs/dhparam.pem;
        ssl_certificate      ssl.certs/server-rsa2k.cert.pem;
        ssl_certificate_key  ssl.certs/server-rsa2k.key.pem;
        #ssl_certificate      ssl.certs/prime256v1TestServer.cert.pem;
        #ssl_certificate_key  ssl.certs/prime256v1TestServer.key.pem;
        #ssl_certificate      ssl.certs/secp384r1TestServer.cert.pem;
        #ssl_certificate_key  ssl.certs/secp384r1TestServer.key.pem;
        ssl_session_cache    off;
        ssl_session_timeout  5m;
        #ssl_buffer_size      64k;
        ssl_protocols  TLSv1.2;
        #ssl_ecdh_curve X25519;
        #ssl_ecdh_curve prime256v1;
        ssl_ciphers  ALL;
        ssl_prefer_server_ciphers   off;
        location /
        {
            root   html;
            index  index.html index.htm;
        }
    }
}
